        console.warn("showDirectoryPicker 失败:", e);
        return false;
      });
    }

    // ============================================================
    // 路径记忆（服务端 session.json，权威来源）
    // ============================================================
    // 已记住的路径（内存 + localStorage 缓存）。
    // 缓存用于：启动时立即回填输入框、并防止"输入框为空时的自动保存"覆盖掉已记住的路径。
    let knownMusicFolder = "";
    let knownCoverFolder = "";
    function cacheKnownPaths() {
      try {
        const cp = JSON.parse(localStorage.getItem("hararuPaths") || "{}");
        knownMusicFolder = cp.musicFolder || "";
        knownCoverFolder = cp.coverFolder || "";
        if (knownMusicFolder) document.getElementById("pathInput").value = knownMusicFolder;
        if (knownCoverFolder) document.getElementById("coverPathInput").value = knownCoverFolder;
      } catch (_) {}
    }
    function persistKnownPaths() {
      try {
        localStorage.setItem("hararuPaths", JSON.stringify({ musicFolder: knownMusicFolder, coverFolder: knownCoverFolder }));
      } catch (_) {}
    }
    // 启动时立即回填（同步，避免异步恢复前被清空）
    cacheKnownPaths();

    function saveAllConfig() {
      // 从输入框读路径；若输入框为空但已记住过路径，则沿用已记住的，避免误清空
      var mf = document.getElementById("pathInput").value.trim();
      var cf = document.getElementById("coverPathInput").value.trim();
      if (mf) knownMusicFolder = mf;
      else mf = knownMusicFolder;
      if (cf) knownCoverFolder = cf;
      else cf = knownCoverFolder;
      persistKnownPaths();
      var config = {
        musicFolder: mf,
        coverFolder: cf,
        coverApiUrl: getCoverApiUrl(),
        coverReferer: coverReferer,
        coverMode: coverMode,
        volume: audio.volume,
        repeatMode: repeatMode,
        shuffle: shuffle
      };
      return fetch("http://127.0.0.1:8787/api/save-path", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config)
      });
    }

    function loadPathFromServer() {
      return fetch("http://127.0.0.1:8787/api/load-path").then(function (r) { return r.json(); });
    }

    function loadAudioFromPath(path) {
      return fetch("http://127.0.0.1:8787/api/list-audio?dir=" + encodeURIComponent(path)).then(function (r) {
        return r.json();
      }).then(function (data) {
        if (!data.files || !data.files.length) return false;
        tracks.forEach(function (t) { if (t.url && t.url.startsWith("blob:")) URL.revokeObjectURL(t.url); });
        tracks = data.files.map(function (f, i) {
          var info = splitArtist(f.name);
          var folderParts = f.relPath.split("/");
          folderParts.pop();
          return {
            id: f.name + "-" + f.size + "-" + Math.floor(f.lastModified) + "-" + i,
            file: null,
            url: "http://127.0.0.1:8787/api/audio?file=" + encodeURIComponent(f.path),
            title: info.title,
            artist: info.artist,
            folder: folderParts.join(" / ") || "手动导入",
            duration: NaN
          };
        });
        current = tracks.length ? 0 : -1;
        playHistory = [];   // 服务端恢复新列表，清空听歌历史
        applySearch();
        if (tracks.length) { loadTrack(0, false); probeDurations(); }
        var folderName = data.folder.replace(/\\/g, "/").split("/").filter(Boolean).pop() || data.folder;
        statusEl.textContent = tracks.length + " 首歌曲 · " + folderName;
        return true;
      });
    }

    function loadCoverImagesFromPath(path) {
      return fetch("http://127.0.0.1:8787/api/list-images?dir=" + encodeURIComponent(path))
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!data.files || !data.files.length) return false;
          localCovers.forEach(function (c) { if (c.url && c.url.startsWith("blob:")) URL.revokeObjectURL(c.url); });
          localCovers = data.files.map(function (f) {
            return { name: f.name, url: "http://127.0.0.1:8787/api/image?file=" + encodeURIComponent(f.path) };
          });
          pathCoverLoaded = true;
          updateCoverControls();
          if (coverMode === "local") setCoverMode("local");
          return true;
        })
        .catch(function (e) {
          console.error("[封面路径加载失败]", path, e);
          return false;
        });
    }

    function initPathMemory() {
      var input = document.getElementById("pathInput");
      var statusEl = document.getElementById("pathStatus");
      var coverInput = document.getElementById("coverPathInput");
      var coverStatus = document.getElementById("coverPathStatus");
      loadPathFromServer().then(function (config) {
        // ① 先从服务端恢复路径到输入框+内存（务必在最前面，否则下面的
        //    applyCombinedMode 会触发 saveAllConfig，趁输入框还没回填就把路径写成空）
        if (config && config.musicFolder) {
          input.value = config.musicFolder;
          knownMusicFolder = config.musicFolder;
        }
        if (config && config.coverFolder) {
          coverInput.value = config.coverFolder;
          knownCoverFolder = config.coverFolder;
        }
        if (knownMusicFolder || knownCoverFolder) persistKnownPaths();
        // 恢复 API 设置
        if (config && config.coverApiUrl) {
          coverApiInput.value = config.coverApiUrl;
          localStorage.setItem("hararuCoverApiUrl", config.coverApiUrl);
        }
        if (config && config.coverReferer) {
          coverReferer = config.coverReferer;
          document.getElementById("coverRefererInput").value = coverReferer;
          localStorage.setItem("hararuCoverReferer", coverReferer);
        }
        if (config && config.coverMode) {
          setCoverMode(config.coverMode);
        }
        // 恢复音量与循环模式（此时已知路径已设置，saveAllConfig 不会再清空路径）
        if (config && typeof config.volume === "number") {
          audio.volume = Math.min(1, Math.max(0, config.volume));
          volumeEl.value = audio.volume;
        }
        if (config && typeof config.repeatMode === "number") {
          const rMode = config.repeatMode % 3;
          const sh = (config && typeof config.shuffle === "boolean") ? config.shuffle : false;
          applyCombinedMode(sh ? 0 : (rMode + 1));
        } else if (config && typeof config.shuffle === "boolean") {
          applyCombinedMode(config.shuffle ? 0 : 1);
        }
        // 恢复封面图片文件夹
        if (config && config.coverFolder) {
          coverStatus.textContent = "正在恢复封面...";
          loadCoverImagesFromPath(config.coverFolder).then(function (ok) {
            coverStatus.textContent = ok ? "✓ 已恢复封面图片" : "封面路径无效，请重新设置";
          });
        } else {
          coverStatus.textContent = config && config.coverApiUrl ? "未保存封面路径" : "未保存封面路径";
        }
        // 恢复音乐文件夹（权威来源，串行执行）
        if (config && config.musicFolder) {
          statusEl.textContent = "正在恢复...";
          return loadAudioFromPath(config.musicFolder).then(function (ok) {
            statusEl.textContent = ok ? "✓ 已恢复上次的文件夹" : "路径文件已变更，请重新设置";
          });
        }
      }).catch(function (e) {
        statusEl.textContent = "";
        coverStatus.textContent = "配置读取失败";
        console.error("[initPathMemory]", e);
      });
    }

    // ============================================================
    // 专注模式（唱片 + 时钟 + 精简播放栏）与小窗播放模式（图片左 + 播放栏右）

    let focusMode = false;
    let miniMode = false;
    let focusClockTimer = null;
    let tbHideTimer = null;

    function updateFocusClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");

      const ss = String(now.getSeconds()).padStart(2, "0");

    // 专注模式

    // 小窗播放模式：进入时缩小，退出时恢复固定的普通窗口尺寸
    async function getTauriWin() {
      try {
        const w = window.__TAURI__?.window;
        if (w && typeof w.getCurrentWindow === "function") return w.getCurrentWindow();
      } catch (_) {}
      return null;
    }

    // ============================================================
    // 小窗/专注模式的窗口尺寸管理（参考 timeless.exe 的稳定实现）
    // 原则：
    //   1. 不再做"跨启动尺寸记忆"：每次打开窗口尺寸由启动时的固定默认决定，
    //      彻底避免 setSize 叠加导致窗口越变越长（旧的 +20px 递增 bug）。
    //   2. 会话内用 outerSize() 记录普通窗口的真实物理尺寸，
    //      供"小窗 → 普通/专注"切换时准确恢复。
    //   3. isRestoring 锁：恢复尺寸期间不记录 resize，防止把中间态当作用户尺寸。
    //   4. 防抖 300ms：只在用户手动拖拽停止后记录。
    // ============================================================
    let normalWindowSize = null;   // 普通窗口的真实物理尺寸（inner 逻辑尺寸，会话内记忆）
    let isRestoring = false;       // 是否正在恢复尺寸（期间不记录 resize）
    let sizeUpdateTimer = null;

    async function readNormalSize() {
      // 统一使用 CSS 逻辑像素（innerWidth/innerHeight）：与 setSize(LogicalSize) 同基准，
      // 避免 outerSize() 返回物理像素在 DPI≠100% 时与逻辑尺寸混淆，导致窗口恢复时被放大
      // （参考 timeless.exe：用同一基准记录/恢复窗口尺寸，杜绝累积与漂移）。
      const w = window.innerWidth || 0;
      const h = window.innerHeight || 0;
      if (w > 0 && h > 0) return { width: w, height: h };
      return null;
    }

    // 用户手动拖拽（或普通窗口尺寸变化）时，防抖记录真实物理尺寸
    function recordNormalSize() {
      if (miniMode || focusMode || isRestoring) return;
      if (!window.__TAURI__) return;
      clearTimeout(sizeUpdateTimer);
      sizeUpdateTimer = setTimeout(async () => {
        const s = await readNormalSize();
        if (s) normalWindowSize = s;
      }, 300);
    }
    window.addEventListener("resize", recordNormalSize);

    async function applySize(w, h) {
      try {
        const win = await getTauriWin();
        if (!win || typeof win.setSize !== "function") return;
        const DPI = window.__TAURI__?.dpi;
        if (DPI && DPI.LogicalSize) await win.setSize(new DPI.LogicalSize(w, h));
        else await win.setSize({ width: w, height: h });
      } catch (_) {}
    }
    // 每次改完窗口尺寸后回到屏幕中心（实现"中心缩放"：放大/缩小都居中）。
    // 注意：PakePlus 禁用了 setPosition/outerPosition，所以不能做"持续围绕中心"拖动缩放，
    // 只能退而求其次——每次改完尺寸后 center() 让窗口居中。
    async function centerWindow() {
      try {
        const win = await getTauriWin();
        if (win && typeof win.center === "function") await win.center();
      } catch (_) {}
    }

    // 记录最后一次鼠标的屏幕坐标（用于"以鼠标为中心缩放"；快捷键触发时用最后一次移动的位置）。
    // 监听多种事件：mousemove 覆盖正常移动；mouseup/pointerup 覆盖释放；pointermove 兜底。
    let lastMouseCenter = { x: null, y: null };
    ["mousemove", "pointermove", "mouseup", "pointerup"].forEach(function (t) {
      window.addEventListener(t, function (e) {
        if (typeof e.screenX === "number") lastMouseCenter = { x: e.screenX, y: e.screenY };
      }, true);
    });

    // 原生拖拽的可靠追踪：Tauri 窗口移动时会持续触发 onMoved 事件。
    // 用"窗口逻辑位置 + 抓取偏移"实时重建鼠标屏幕坐标，拖拽结束时它已是松开点的位置，
    // 不再依赖 startDragging 的返回时机（不可靠，导致时灵时不灵）。
    // 仅用户拖拽期间生效（dragTrackActive），其余程序化/启动移动一律忽略，避免窗口乱走。
    let dragTrackGrab = { x: 0, y: 0 };
    let dragTrackTimer = null;
    let dragTrackActive = false;
    function reconstructCursorAnchor(winPos) {
      if (!winPos || typeof winPos.x !== "number") return;
      const dpr = window.devicePixelRatio || 1;
      lastMouseCenter = { x: winPos.x / dpr + dragTrackGrab.x, y: winPos.y / dpr + dragTrackGrab.y };
    }
    async function bindMoveTracking() {
      try {
        const win = await getTauriWin();
        if (!win || typeof win.onMoved !== "function") return;
        await win.onMoved(async function (event) {
          if (!dragTrackActive) return;
          let pos = (event && event.payload && typeof event.payload.x === "number") ? event.payload : null;
          if (!pos) {
            try {
              if (typeof win.innerPosition === "function") pos = await win.innerPosition();
              else if (typeof win.outerPosition === "function") pos = await win.outerPosition();
            } catch (_) { pos = null; }
          }
          if (pos && typeof pos.x === "number") {
            clearTimeout(dragTrackTimer);
            dragTrackTimer = setTimeout(function () { reconstructCursorAnchor(pos); }, 120);
          }
        });
      } catch (_) {}
    }
    bindMoveTracking();

    // 拖拽开始：记录抓取偏移 + 置拖拽标记；结束后取真实位置并解除标记（供三处拖拽入口复用）
    async function startTrackedDrag(win, event) {
      if (!win || typeof win.startDragging !== "function") return;
      dragTrackGrab = { x: event.clientX, y: event.clientY };
      dragTrackActive = true;
      try { await win.startDragging(); } catch (_) {}
      const readPos = async function () {
        try {
          let pos = null;
          if (typeof win.innerPosition === "function") pos = await win.innerPosition();
          else if (typeof win.outerPosition === "function") pos = await win.outerPosition();
          if (pos && typeof pos.x === "number") reconstructCursorAnchor(pos);
        } catch (_) {}
      };
      readPos();
      setTimeout(function () { readPos(); dragTrackActive = false; }, 300);
    }

    // 以鼠标为中心定位窗口（需要壳允许 setPosition；若被禁用则回退到屏幕居中 center()）
    async function positionWindowCentered(mx, my, w, h) {
      try {
        const win = await getTauriWin();
        if (!win) return;
        let moved = false;
        if (typeof win.setPosition === "function" && typeof mx === "number" && typeof my === "number") {
          try {
            const DPI = window.__TAURI__?.dpi;
            const x = Math.max(0, Math.round(mx - w / 2));
            const y = Math.max(0, Math.round(my - h / 2));
            if (DPI && DPI.LogicalPosition) { await win.setPosition(new DPI.LogicalPosition(x, y)); moved = true; }
            else { await win.setPosition({ x: x, y: y }); moved = true; }
          } catch (_) {}
        }
        if (!moved) { await centerWindow(); }
      } catch (_) {}
    }

    // 取消过渡：直接把窗口切到目标尺寸，并一步居中到锚点（鼠标屏幕坐标）。
    // 不保留任何缩放/位移动画，因此没有卡顿感。
    async function setWindowSizeCentered(targetW, targetH, cx, cy) {
      try {
        const win = await getTauriWin();
        if (!win || typeof win.setSize !== "function") return;
        const DPI = window.__TAURI__?.dpi;
        const setS = (w, h) => DPI && DPI.LogicalSize ? win.setSize(new DPI.LogicalSize(w, h)) : win.setSize({ width: w, height: h });
        const setP = (x, y) => DPI && DPI.LogicalPosition ? win.setPosition(new DPI.LogicalPosition(x, y)) : win.setPosition({ x: x, y: y });
        await setS(targetW, targetH);
        if (typeof cx === "number" && typeof cy === "number" && typeof win.setPosition === "function") {
          await setP(Math.max(0, Math.round(cx - (targetW + OH_w) / 2)), Math.max(0, Math.round(cy - (targetH + OH_h) / 2)));
        } else if (typeof win.center === "function") {
          await win.center();
        }
      } catch (_) {}
    }

    // 壳对 setSize 会再加约 OH 像素（setSize(W,H) → 窗口 ≈ W+OH_w 宽 × H+OH_h 高）。
    // 进入小窗时实测校准，用于"小窗 → 普通"恢复时做补偿，保证恢复后尺寸准确。
    let OH_w = 0;
    let OH_h = 0;

    async function getMiniSize() {
      // 目标高度 130（壳加约 20 → 实测约 150），图片做成正方形填满内容区
      return { width: 400, height: 130 };
    }

    // 恢复普通窗口尺寸（从小窗/专注切回普通时）
    async function restoreNormalSize() {
      isRestoring = true;
      try {
        if (normalWindowSize) {
          // 减去壳叠加量补偿，使 setSize 后实际窗口 == 记录的真实尺寸
          const target = {
            width: Math.max(0, normalWindowSize.width - OH_w),
            height: Math.max(0, normalWindowSize.height - OH_h)
          };
          // 平滑缩放回普通尺寸（以鼠标为中心，保证绕鼠标缩放、不闪跳）
          // 直接切回普通尺寸（以鼠标为中心，无过渡）
          await setWindowSizeCentered(target.width, target.height, lastMouseCenter.x, lastMouseCenter.y);
        }
      } catch (_) {}
      // 等待系统重绘/缩放完成后解锁，期间不记录 resize（防止把恢复过程当作用户拖拽）
      setTimeout(() => { isRestoring = false; }, 800);
    }

    // 启动时固定为默认尺寸（常量 → 每次结果一致，不会越变越长/窄）
    const DEFAULT_W = 1150;
    const DEFAULT_H = 820;
    const START_OH_W = 0;   // 壳对 setSize 的宽度叠加量（启动用固定近似值）
    const START_OH_H = 20;  // 壳对 setSize 的高度叠加量（启动用固定近似值）
    async function forceDefaultSize() {
      if (miniMode || focusMode) return;
      await applySize(Math.max(0, DEFAULT_W - START_OH_W), Math.max(0, DEFAULT_H - START_OH_H));
      // 设置尺寸后再居中（防止 setSize 使窗口偏离屏幕中心）
      try {
        const win = await getTauriWin();
        if (win && typeof win.center === "function") await win.center();
      } catch (_) {}
    }
    // 启动时固定为默认尺寸：等 __TAURI__ 就绪后立即执行（不等 250ms），
    // 把"壳按旧记忆创建出的偏差尺寸"尽快拉回，缩短闪变窗口；
    // 配合关闭前校正后，下次启动壳创建的就是目标尺寸，启动瞬间即正确、无闪变。
    (function initDefaultSize() {
      const tryApply = function () {
        if (window.__TAURI__ && window.__TAURI__.window &&
            typeof window.__TAURI__.window.getCurrentWindow === "function") {
          forceDefaultSize();
        } else {
          setTimeout(tryApply, 50);
        }
      };
      tryApply();
    })();

    // 关闭前校正窗口尺寸（根治启动闪变 + 初始固定 1150×800）：
    // 壳会把"关闭时窗口的 inner 逻辑尺寸"×DPI 保存到
    // %APPDATA%\com.pakeplus.pacbao\ccaedcfae.json 的 window_size，
    // 下次启动时作为 setSize 目标，且壳对 setSize 会再叠加约 20px 高度。
    // 因此关闭前把窗口校正为「当前实际尺寸 − 叠加量」，使壳保存的值 = 当前尺寸−20，
    // 下次启动叠加 20 后恰好等于当前尺寸。
    // 用「当前尺寸」而非固定默认值作为校正目标：关闭时窗口尺寸几乎不变（仅 −20px），
    // 避免关闭瞬间被强制跳到默认尺寸造成「关闭闪变」；初始尺寸由启动时 forceDefaultSize 固定。
    // 关键：onCloseRequested 必须 preventDefault 阻止窗口立刻关闭，
    // 待 await setSize 完成后再由我们手动关闭窗口；否则 async 校正不会生效，
    // 壳仍会保存未校正的尺寸，导致下次启动先偏大再被拉回（旧的闪变 bug）。
    async function setupCloseSizeFix() {
      try {
        const win = await getTauriWin();
        if (!win || typeof win.onCloseRequested !== "function") return;
        let closeFixed = false; // 重入保护：校正完成后放行真正的关闭
        win.onCloseRequested(async (event) => {
          if (closeFixed) return; // 第二次触发（我们手动 close）：放行关闭
          closeFixed = true;
          try {
            if (event && typeof event.preventDefault === "function") {
              event.preventDefault(); // 阻止窗口立刻关闭，等待尺寸校正
            }
            const DPI = window.__TAURI__?.dpi;
            if (DPI && DPI.LogicalSize && typeof win.setSize === "function") {
              // 用「当前实际窗口尺寸 − 壳叠加量」作为校正目标：
              // 关闭时窗口尺寸几乎不变（仅 −20px），避免关闭闪变；
              // 壳保存的值 = 当前尺寸−20，下次启动叠加 20 后恰好等于当前尺寸。
              const w = window.innerWidth || DEFAULT_W;
              const h = Math.max(100, (window.innerHeight || DEFAULT_H) - START_OH_H);
              await win.setSize(new DPI.LogicalSize(w, h));
            }
          } catch (_) {}
          // 校正完成后真正关闭（再次触发 onCloseRequested，被重入保护放行）
          try {
            await win.close();
          } catch (_) {
            try { if (typeof win.destroy === "function") await win.destroy(); } catch (__) {}
          }
        });
      } catch (_) {}
    }
    setupCloseSizeFix();

    async function enterMiniMode() {
      miniMode = true;
      focusMode = false;
      miniOverlay.classList.add("show");
      focusOverlay.classList.remove("show");
      document.body.classList.add("mini-mode");
      document.body.classList.remove("focus-mode");
      document.querySelector(".titlebar-controls")?.classList.remove("visible");
      setBtnState("tbMini", true, "退出小窗播放");
      setBtnState("tbFocus", false, "专注模式");
      clearFocusClock();
      syncModeImages();
      miniTrackTitle.textContent = tracks[current] ? tracks[current].title : "未在播放";
      miniCur.textContent = currentTimeEl.textContent;
      miniTotal.textContent = totalTimeEl.textContent;
      miniSeek.value = seekEl.value;
      miniPlayBtn.textContent = audio.paused ? "▶" : "⏸";
      // 进入小窗前记录当前普通窗口的真实物理尺寸（供退出时恢复）
      const s = await readNormalSize();
      if (s) normalWindowSize = s;
      const m = await getMiniSize();
      // 以鼠标为中心平滑缩放进入小窗（连续 setSize+setPosition，窗口绕鼠标中心缩放，不闪跳）
      // 直接切到小窗尺寸（以鼠标为中心，无过渡，不卡顿）
      await setWindowSizeCentered(m.width, m.height, lastMouseCenter.x, lastMouseCenter.y);
      // 小窗稳定后实测壳的叠加量（setSize 目标 → 实际窗口物理尺寸 的差值）
      await new Promise(function (r) { setTimeout(r, 200); });
      const ms = await readNormalSize();
      if (ms) {
        OH_w = Math.max(0, ms.width - m.width);
        OH_h = Math.max(0, ms.height - m.height);
      }
    }
    async function exitMiniMode() {
      miniMode = false;
      miniOverlay.classList.remove("show");
      document.body.classList.remove("mini-mode");
      setBtnState("tbMini", false, "小窗播放");
      // 退出小窗：恢复到进入小窗前的普通窗口尺寸
      await restoreNormalSize();
    }

    document.getElementById("tbFocus")?.addEventListener("click", () => focusMode ? exitFocusMode() : enterFocusMode());
    document.getElementById("tbMini")?.addEventListener("click", () => miniMode ? exitMiniMode() : enterMiniMode());

    // 置顶窗口按钮（Pin）：切换 always-on-top，点亮 .on 表示已置顶
    let windowAlwaysOnTop = false;
    const tbPinBtn = document.getElementById("tbPin");
    tbPinBtn?.addEventListener("click", async () => {
      try {
        const win = await getTauriWin();
        if (!win || typeof win.setAlwaysOnTop !== "function") return;
        windowAlwaysOnTop = !windowAlwaysOnTop;
        await win.setAlwaysOnTop(windowAlwaysOnTop);
        tbPinBtn.classList.toggle("on", windowAlwaysOnTop);
        tbPinBtn.title = windowAlwaysOnTop ? "取消置顶" : "置顶窗口";
      } catch (_) {}
    });

    // 小窗切换（Ctrl+空格）与专注切换（Ctrl+回车）
    let miniToggleGuard = false;
    function toggleMiniMode() {
      if (miniToggleGuard) return; // 防止同一按键多次触发导致"进入又退出"
      miniToggleGuard = true;
      setTimeout(function () { miniToggleGuard = false; }, 250);
      if (miniMode) exitMiniMode(); else enterMiniMode();
    }
    let focusToggleGuard = false;
    function toggleFocusMode() {
      if (focusToggleGuard) return;
      focusToggleGuard = true;
      setTimeout(function () { focusToggleGuard = false; }, 250);
      if (focusMode) exitFocusMode(); else enterFocusMode();
    }
    // window 捕获阶段单一监听（不受焦点/冒泡影响，也不会重复触发）
    window.addEventListener("keydown", (event) => {
      // 输入法合成期间不响应快捷键，避免与中文输入法冲突
      if (event.isComposing || event.keyCode === 229) return;
      if (event.ctrlKey && event.code === "Enter") {
        event.preventDefault();
        toggleFocusMode();
      }
      if (event.ctrlKey && event.code === "Space") {
        event.preventDefault();
        toggleMiniMode();
      }
      // Ctrl+M：小窗切换备用键（中文输入法可能吞掉 Ctrl+空格）
      if (event.ctrlKey && !event.shiftKey && !event.altKey && (event.code === "KeyM" || event.key.toLowerCase() === "m")) {
        event.preventDefault();
        toggleMiniMode();
      }
    }, true);

    // 媒体键 / 播放控制：Fn+F7 上一首、Fn+F8 播放暂停、Fn+F9 下一首
    window.addEventListener("keydown", (event) => {
      const c = event.code || "";
      const k = event.key || "";
      if (c === "F7" || k === "MediaTrackPrevious") { event.preventDefault(); if (tracks.length) prevTrack(); }
      else if (c === "F8" || k === "MediaPlayPause") { event.preventDefault(); togglePlay(); }
      else if (c === "F9" || k === "MediaTrackNext") { event.preventDefault(); if (tracks.length) nextTrack(); }
    }, true);
    // 注册系统媒体会话（后台时媒体键尽量仍能控制播放）
    try {
      if ("mediaSession" in navigator) {
        navigator.mediaSession.setActionHandler("pause", function () { if (!audio.paused) audio.pause(); });
        navigator.mediaSession.setActionHandler("play", function () { if (audio.paused && tracks.length) audio.play().catch(function () {}); });
        navigator.mediaSession.setActionHandler("previoustrack", function () { if (tracks.length) prevTrack(); });
        navigator.mediaSession.setActionHandler("nexttrack", function () { if (tracks.length) nextTrack(); });
      }
    } catch (_) {}

    // 常规界面双击 → 进入专注模式；专注模式界面双击 → 退回普通模式
    appEl?.addEventListener("dblclick", (event) => {
      if (event.target.closest("button, input, a, .row, .titlebar, .player, .focus-overlay, .mini-overlay")) return;
      if (focusMode || miniMode) return;
      enterFocusMode();
    });
    // 专注模式遮罩双击（避开按钮/进度条）→ 回到普通模式
    focusOverlay?.addEventListener("dblclick", (event) => {
      if (event.target.closest("button, input")) return;
      if (focusMode) exitFocusMode();
    });

    // 小窗模式：鼠标滑到右上角时短暂显示退出按钮
    miniExitBtn?.addEventListener("click", () => { if (miniMode) exitMiniMode(); });
    window.addEventListener("mousemove", (event) => {
      if (!miniMode) return;
      clearTimeout(miniExitTimer);
      const inCorner = event.clientY < 64 && event.clientX > window.innerWidth - 90;
      if (inCorner) {
        miniExitBtn?.classList.add("show");
        miniExitTimer = setTimeout(() => miniExitBtn?.classList.remove("show"), 2000);
      } else {
        miniExitBtn?.classList.remove("show");
      }
    });

    // 专注模式下：标题栏按钮过一段时间自动隐藏，鼠标移入顶部时暂时显示
    function setTitlebarVisible(vis) {
      document.querySelector(".titlebar-controls")?.classList.toggle("visible", vis);
    }
    window.addEventListener("mousemove", (event) => {
      if (!focusMode) return;
      clearTimeout(tbHideTimer);
      if (event.clientY < 60) {
        setTitlebarVisible(true);
        tbHideTimer = setTimeout(() => setTitlebarVisible(false), 2500);
      } else {
        setTitlebarVisible(false);
      }
    });

    // 专注模式精简播放栏
    document.getElementById("focusPlay")?.addEventListener("click", togglePlay);
    document.getElementById("focusPrev")?.addEventListener("click", prevTrack);
    document.getElementById("focusNext")?.addEventListener("click", nextTrack);
    focusSeek.addEventListener("input", () => {
      userSeeking = true;
      if (Number.isFinite(audio.duration)) {
        focusCur.textContent = formatTime((Number(focusSeek.value) / 1000) * audio.duration);
      }
    });
    focusSeek.addEventListener("change", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(focusSeek.value) / 1000) * audio.duration;
      }
      userSeeking = false;
    });
    document.getElementById("focusVolume").addEventListener("input", (event) => {
      audio.volume = Number(event.target.value);
      localStorage.setItem("hararuVolume", event.target.value);
    });

    // 小窗播放栏
    document.getElementById("miniPlay")?.addEventListener("click", togglePlay);
    document.getElementById("miniPrev")?.addEventListener("click", prevTrack);
    document.getElementById("miniNext")?.addEventListener("click", nextTrack);
    miniSeek.addEventListener("input", () => {
      userSeeking = true;
      if (Number.isFinite(audio.duration)) {
        miniCur.textContent = formatTime((Number(miniSeek.value) / 1000) * audio.duration);
      }
    });
    miniSeek.addEventListener("change", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(miniSeek.value) / 1000) * audio.duration;
      }
      userSeeking = false;
    });
    // 双击小窗图片退出小窗模式（窗口栏按钮在小窗下隐藏，Ctrl+空格也可退出）
    miniArtImg.addEventListener("dblclick", () => { if (miniMode) exitMiniMode(); });

    // 播放状态变化时同步专注 / 小窗界面
    audio.addEventListener("play", () => {
      focusPlayBtn.textContent = "⏸";
      miniPlayBtn.textContent = "⏸";
      focusFilm.classList.add("playing");
      if (focusMode) focusTrackTitle.textContent = tracks[current] ? tracks[current].title : "未在播放";
      if (miniMode) miniTrackTitle.textContent = tracks[current] ? tracks[current].title : "未在播放";
    });
    audio.addEventListener("pause", () => {
      focusPlayBtn.textContent = "▶";
      miniPlayBtn.textContent = "▶";
      focusFilm.classList.remove("playing");
    });
    audio.addEventListener("timeupdate", () => {
      if (focusMode && !userSeeking && Number.isFinite(audio.duration)) {
        focusSeek.value = String((audio.currentTime / audio.duration) * 1000);
      }
      if (miniMode && !userSeeking && Number.isFinite(audio.duration)) {
        miniSeek.value = String((audio.currentTime / audio.duration) * 1000);
      }
      if (focusMode) focusCur.textContent = currentTimeEl.textContent;
      if (miniMode) miniCur.textContent = currentTimeEl.textContent;
    });
    audio.addEventListener("loadedmetadata", () => {
      if (focusMode) focusTotal.textContent = formatTime(audio.duration);
      if (miniMode) miniTotal.textContent = formatTime(audio.duration);
    });

    // 封面变化时同步两张模式的图片（API/本地切换都会更新 cover 的 src）
    if (window.MutationObserver && coverEl) {
      new MutationObserver(syncModeImages).observe(coverEl, { attributes: true, attributeFilter: ["src"] });
    }

    // ============================================================
    // 启动：串行恢复（IndexedDB 兜底封面 → 服务端路径恢复）
    // 注意：不使用已废弃的 showDirectoryPicker 句柄恢复，
    // 以免与 session.json 权威来源并行写同一份 tracks 互相覆盖。
    // ============================================================
    updateCoverControls();
    // 恢复上次的模式（本地）
    const savedRepeat = localStorage.getItem("hararuRepeatMode");
    const savedShuffle = localStorage.getItem("hararuShuffle");
    if (savedRepeat !== null || savedShuffle !== null) {
      const sh = savedShuffle === "1";
      const rMode = savedRepeat !== null ? (Number(savedRepeat) % 3) : 0;
      applyCombinedMode(sh ? 0 : (rMode + 1));
    }
    loadLocalCovers().then(function () {
      initPathMemory();
      setStartupCover();
    });
  </script>
</body>
</html>
