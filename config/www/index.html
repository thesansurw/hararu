<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hararu · 樱花音乐盒</title>
  <style>
    /* 隐藏 vConsole 调试悬浮按钮 */
    #__vconsole, .vc-switch { display: none !important; }

    /* ===== 输入法控制：默认禁用 IME，仅在文本输入框启用（避免快捷键被中文输入法拦截）===== */
    /* 说明：ime-mode 属旧标准，Chromium/WebView2 可能忽略；即使生效，也保证快捷键
       在输入法合成期间不会误触发（已在 JS 用 isComposing/keyCode 229 兜底）。 */
    body, body * { ime-mode: disabled !important; }
    input[type="text"], input[type="search"], input[type="url"],
    input[type="password"], input[type="email"], input[type="number"],
    input:not([type]), textarea, [contenteditable="true"] { ime-mode: active !important; }

    :root {
      color-scheme: light;
      --bg-1: #fdf1f7;
      --bg-2: #f8e3ee;
      --panel: rgba(255, 255, 255, .72);
      --panel-solid: #fffbfd;
      --text: #4a3f45;
      --muted: #9d8a94;
      --line: rgba(214, 150, 180, .30);
      --accent: #e79bbd;
      --accent-deep: #d07fa4;
      --accent-2: #b9a3d9;
      --danger: #e56d75;
      --shadow: 0 24px 70px rgba(210, 140, 170, .28);
      --soft-shadow: 0 8px 30px rgba(210, 150, 175, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 800px at 15% 10%, #fff0f6 0%, transparent 55%),
        radial-gradient(1000px 700px at 90% 85%, #fce3ee 0%, transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    button, input { font: inherit; }

    /* ===== 飘落花瓣装饰 ===== */
    .petal {
      position: fixed;
      top: -6vh;
      width: 12px;
      height: 12px;
      border-radius: 80% 0 55% 50% / 55% 0 80% 50%;
      background: linear-gradient(135deg, #ffd7e8, #ffb7d3);
      opacity: .55;
      pointer-events: none;
      z-index: 0;
      animation: petalFall linear infinite;
    }
    @keyframes petalFall {
      0%   { transform: translate3d(0, -8vh, 0) rotate(0deg); }
      100% { transform: translate3d(-14vw, 115vh, 0) rotate(340deg); }
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(340px, 44vw) 1fr;
      height: 100vh;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
      z-index: 1;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(253, 241, 247, .28), rgba(253, 241, 247, .88)),
        var(--cover, linear-gradient(150deg, #ffd9e8, #f7c3da)) center / cover no-repeat;
      transform: scale(1.04);
      filter: saturate(.92) blur(0px);
      transition: background 0.6s ease;
    }
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 244, 248, .30);
      backdrop-filter: blur(16px);
    }

    /* ===== 左侧：正在播放 ===== */
    .now {
      display: grid;
      align-content: end;
      height: 100vh;
      min-height: 0;
      padding: 48px 40px 56px;
      overflow: hidden;
    }

    .cover-wrap {
      width: min(420px, 100%);
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: linear-gradient(150deg, #ffe3ef, #fbd7e6);
      position: relative;
    }
    .cover-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      box-shadow: inset 0 0 0 1px rgba(214, 150, 180, .25);
      pointer-events: none;
    }
    .cover-wrap.playing .cover {
      animation: coverGlow 3s ease-in-out infinite;
    }
    @keyframes coverGlow {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.06); }
    }
    .cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity .45s ease;
    }

    .track-meta {
      width: min(520px, 100%);
      margin-top: 26px;
    }
    .eyebrow {
      color: var(--accent-deep);
      font-size: 13px;
      letter-spacing: .12em;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eyebrow .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(231, 155, 189, .22);
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4.6vw, 56px);
      line-height: 1.08;
      letter-spacing: .01em;
      overflow-wrap: anywhere;
      font-weight: 700;
    }
    .artist {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    /* ===== 右侧工作区 ===== */
    .workspace {
      min-width: 0;
      height: 100vh;
      min-height: 0;
      padding: 30px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) minmax(120px, auto);
      gap: 16px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .search {
      position: relative;
      flex: 1;
      min-width: 150px;
    }
    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px 0 40px;
      background: rgba(255, 255, 255, .72);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search input:focus {
      border-color: rgba(208, 127, 164, .65);
      box-shadow: 0 0 0 4px rgba(231, 155, 189, .18);
    }
    .search span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .button {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 16px;
      color: var(--text);
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: background .2s, border-color .2s, transform .12s, box-shadow .2s;
    }
    .button:hover {
      border-color: rgba(208, 127, 164, .55);
      background: rgba(255, 240, 247, .95);
      box-shadow: var(--soft-shadow);
    }
    .button:active { transform: translateY(1px); }
    .button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(231, 155, 189, .42);
    }
    .button.small {
      height: 36px;
      padding-inline: 12px;
      font-size: 13px;
      border-radius: 11px;
    }

    #folderInput, #coverFilesInput, #coverFolderInput {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ===== 封面来源栏 ===== */
    .coverbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      min-width: 0;
    }
    .coverbar-label {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, .72);
    }
    .segment {
      height: 36px;
      border: 0;
      border-right: 1px solid var(--line);
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .segment:last-child { border-right: 0; }
    .segment.active {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      font-weight: 700;
    }
    .api-input {
      flex: 1 1 300px;
      min-width: 200px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 0 12px;
      background: rgba(255, 255, 255, .72);
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .api-input:focus {
      border-color: rgba(208, 127, 164, .65);
      box-shadow: 0 0 0 4px rgba(231, 155, 189, .18);
    }
    .cover-count {
      color: var(--muted);
      font-size: 13px;
      min-width: 5em;
    }

    .path-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
      background: rgba(255, 255, 255, .55);
      border: 1px dashed rgba(214, 150, 180, .45);
      border-radius: 11px;
      padding: 4px 8px;
    }
    .path-chip input {
      width: 170px;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .path-chip input:focus { background: rgba(255, 255, 255, .8); }
    .path-status {
      font-size: 12px;
      color: var(--muted);
    }

    /* ===== 播放列表 ===== */
    .library {
      min-height: 0;
      height: 100%;
      max-height: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      position: relative;
      z-index: 1;
      box-shadow: var(--soft-shadow);
    }
    .library-head {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 96px 40px;
      gap: 12px;
      padding: 12px 18px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      align-items: center;
    }
    .list {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }
    .list::-webkit-scrollbar { width: 10px; }
    .list::-webkit-scrollbar-thumb {
      background: rgba(208, 127, 164, .30);
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }
    .list::-webkit-scrollbar-track { background: transparent; }

    .row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 96px 40px;
      gap: 12px;
      align-items: center;
      min-height: 56px;
      padding: 8px 18px;
      border-bottom: 1px solid rgba(214, 150, 180, .12);
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .row:hover { background: rgba(255, 226, 238, .55); }
    .row.active {
      background: linear-gradient(90deg, rgba(231, 155, 189, .20), rgba(231, 155, 189, .06));
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .index {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .row.active .index { color: var(--accent-deep); font-weight: 700; }
    .song-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row.active .song-title { color: var(--accent-deep); font-weight: 600; }
    .song-title mark {
      background: rgba(231, 155, 189, .35);
      color: var(--accent-deep);
      border-radius: 3px;
      padding: 0 1px;
    }
    .song-path {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .duration {
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .row-actions {
      opacity: 0;
      transition: opacity .15s;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }
    .row:hover .row-actions, .row.active .row-actions { opacity: 1; }
    .row-actions:hover { color: var(--danger); }

    .empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      line-height: 1.8;
    }
    .empty .big { font-size: 40px; margin-bottom: 8px; }

    /* ===== 播放器控制 ===== */
    .player {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(18px);
      padding: 16px 20px;
      display: grid;
      gap: 12px;
      min-height: 120px;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      box-shadow: 0 14px 44px rgba(210, 150, 175, .24);
    }
    .timeline {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-deep);
      height: 6px;
      cursor: pointer;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
    }
    .main-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: center;
    }
    .right-controls {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
    }
    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 240, 247, .7);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: background .2s, transform .12s, box-shadow .2s, color .2s;
    }
    .icon-button svg,
    .right-controls span svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .icon-button:hover {
      background: rgba(255, 226, 238, .95);
      box-shadow: var(--soft-shadow);
    }
    .icon-button:active { transform: scale(.94); }
    .icon-button.play {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      border-color: transparent;
      font-size: 20px;
      box-shadow: 0 10px 26px rgba(231, 155, 189, .5);
    }
    .icon-button.on {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      border-color: transparent;
    }

    .drop-active .library {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    /* ===== 自定义标题栏（无边框窗口，全透明悬浮） ===== */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      background: transparent;
      border-bottom: none;
      /* 高于专注模式遮罩(2000)，使窗口控制与专注切换始终可用 */
      z-index: 3000;
      user-select: none;
    }
    .titlebar-title {
      display: none;
    }
    .titlebar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding-right: 2px;
    }
    .titlebar-controls button {
      width: 36px;
      height: 30px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .42);
      color: rgba(74, 63, 69, .8);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background .18s, color .18s, transform .12s, box-shadow .18s;
      backdrop-filter: blur(6px);
    }
    .titlebar-controls button svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .titlebar-controls button:hover {
      background: rgba(231, 155, 189, .30);
      color: var(--accent-deep);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(210, 140, 170, .28);
    }
    .titlebar-controls button:active { transform: scale(.92); }
    .titlebar-controls .tb-close:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 4px 14px rgba(229, 109, 117, .4);
    }
    .titlebar-controls button.on {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
    }

    /* ===== 专注模式（唱片 + 时钟 + 精致播放栏） ===== */
    .focus-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(90% 70% at 50% 36%, rgba(231,155,189,.12), transparent 60%),
        radial-gradient(70% 50% at 82% 92%, rgba(185,163,217,.10), transparent 55%),
        radial-gradient(ellipse at center, #1b1218, #0c060a);
      color: #f0e6ec;
      user-select: none;
      overflow: hidden;
    }
    .focus-overlay.show {
      display: flex;
    }

    .focus-clock {
      font-size: 66px;
      font-weight: 200;
      letter-spacing: 6px;
      color: rgba(244,236,240,.92);
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 0 34px rgba(231,155,189,.28);
    }
    .focus-date {
      font-size: 13px;
      color: rgba(240,230,236,.45);
      letter-spacing: 3px;
      margin-bottom: 40px;
    }

    /* 专注模式下标题栏按钮自动隐藏，鼠标移入顶部时暂时显示 */
    body.focus-mode .titlebar-controls {
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    body.focus-mode .titlebar-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* 唱片形状：圆盘 + 细腻沟槽 + 中央封面贴标 + 光晕 */
    .focus-record {
      position: relative;
      width: min(340px, 54vw);
      height: min(340px, 54vw);
      flex-shrink: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          #222 0px, #222 1px, #0b0b0b 2px, #262626 3px, #0d0d0d 4px),
        radial-gradient(circle at 50% 50%, #2a2a2a, #0b0b0b);
      box-shadow:
        0 0 60px rgba(231,155,189,.14),
        0 26px 80px rgba(0,0,0,.6),
        inset 0 0 26px rgba(0,0,0,.7),
        inset 0 0 3px rgba(255,255,255,.07);
      animation: focus-spin 20s linear infinite;
      animation-play-state: paused;
    }
    .focus-record.playing { animation-play-state: running; }
    .focus-record::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,.10), transparent 42%);
      pointer-events: none;
    }
    .focus-record-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84%;
      height: 84%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(255,255,255,.10), inset 0 0 14px rgba(0,0,0,.6);
      background: #2a2226;
    }
    .focus-record-label img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes focus-spin {
      100% { transform: rotate(360deg); }
    }

    .focus-player {
      margin-top: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(440px, 80vw);
    }
    .focus-track {
      font-size: 16px;
      color: rgba(240,230,236,.78);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .focus-track::before {
      content: "♪ ";
      color: var(--accent);
    }
    .focus-timeline {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      font-size: 12px;
      color: rgba(240,230,236,.5);
      font-variant-numeric: tabular-nums;
    }
    .focus-timeline input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
    }
    .focus-controls {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .focus-controls button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: #f0e6ec;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      transition: background .2s, transform .12s, box-shadow .2s;
    }
    .focus-controls button:hover {
      background: rgba(255,255,255,.16);
      transform: translateY(-1px);
    }
    .focus-controls button:active { transform: scale(.9); }
    .focus-controls .focus-play {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #1b1510;
      font-size: 23px;
      box-shadow: 0 8px 24px rgba(231,155,189,.45), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .focus-controls .focus-play:hover {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent-2));
      transform: translateY(-1px);
    }
    .focus-volume {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(240,230,236,.6);
      font-size: 14px;
      margin-top: 2px;
    }
    .focus-volume input[type="range"] {
      width: 110px;
      height: 5px;
      accent-color: var(--accent);
    }

    /* 小窗模式下隐藏整个标题栏（去掉拖拽区，避免挡住右上角退出按钮）；
       整个小窗改为可拖拽，交互元素除外 */
    body.mini-mode .titlebar {
      display: none;
    }

    /* ===== 小窗播放模式（重排版：渐变背景 + 封面高光 + 精致控制组） ===== */
    .mini-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      background:
        radial-gradient(120% 90% at 16% 10%, rgba(231,155,189,.18), transparent 55%),
        radial-gradient(90% 70% at 85% 95%, rgba(185,163,217,.12), transparent 50%),
        radial-gradient(ellipse at center, #1b1218, #0d070b);
      color: #f0e6ec;
      user-select: none;
      overflow: hidden;
    }
    .mini-overlay.show {
      display: flex;
    }
    .mini-exit {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 4000;
      width: 34px;
      height: 30px;
      border: 0;
      border-radius: 10px;
      background: rgba(255,255,255,.14);
      color: #f0e6ec;
      font-size: 13px;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .mini-exit.show {
      opacity: 1;
      pointer-events: auto;
    }
    .mini-exit:hover { background: rgba(255,255,255,.28); }
    .mini-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      height: 100%;
      padding: 10px 16px;
    }
    .mini-art {
      flex: 0 0 auto;
      width: 130px;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: #000;
      box-shadow:
        0 12px 30px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.10);
    }
    .mini-art::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(150deg, rgba(255,255,255,.18), transparent 42%);
      pointer-events: none;
    }
    .mini-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .mini-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .mini-track {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      color: rgba(240,230,236,.85);
      min-width: 0;
    }
    .mini-track::before {
      content: "♪";
      color: var(--accent);
      font-size: 12px;
      flex-shrink: 0;
    }
    .mini-track span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-timeline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: rgba(240,230,236,.45);
      font-variant-numeric: tabular-nums;
    }
    .mini-timeline input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .mini-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .mini-controls button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: #f0e6ec;
      font-size: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      transition: background .2s, transform .12s, box-shadow .2s;
    }
    .mini-controls button:hover {
      background: rgba(255,255,255,.16);
      transform: translateY(-1px);
    }
    .mini-controls button:active { transform: scale(.9); }
    .mini-controls .mini-play {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #1b1510;
      font-size: 18px;
      box-shadow: 0 6px 18px rgba(231,155,189,.45), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .mini-controls .mini-play:hover {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent-2));
      transform: translateY(-1px);
    }

    /* 服务状态提示条 */
    .service-banner {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #fff2ec, #ffe3e3);
      color: #b3544f;
      font-size: 13px;
      border-bottom: 1px solid rgba(229, 109, 117, .35);
      text-align: center;
    }
    .service-banner.visible { display: flex; }
    .service-banner button {
      border: 1px solid rgba(229, 109, 117, .5);
      background: #fff;
      color: #b3544f;
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .service-banner button:hover { background: rgba(229, 109, 117, .1); }

    /* 壳版：全透明悬浮标题栏，按钮悬浮于右上角留白区，内容顶格铺满 */
    body.has-titlebar { padding-top: 0; }
    body.has-titlebar .shell { height: 100vh; min-height: 100vh; }
    body.has-titlebar .now { height: 100vh; min-height: 100vh; }
    body.has-titlebar .workspace {
      height: 100vh;
      min-height: 100vh;
      /* 顶部为悬浮按钮留白，底部防止播放栏贴边 */
      padding-top: 52px;
      padding-bottom: 34px;
    }

    /* ===== 右键菜单 ===== */
    .context-menu {
      position: fixed;
      z-index: 999;
      min-width: 170px;
      background: rgba(255, 251, 253, .97);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(200, 130, 165, .30);
      padding: 6px;
      backdrop-filter: blur(10px);
      animation: menuIn .12s ease;
    }
    @keyframes menuIn {
      from { opacity: 0; transform: translateY(-4px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .menu-item {
      padding: 9px 12px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .menu-item:hover { background: rgba(231, 155, 189, .18); }
    .menu-item.danger { color: var(--danger); }
    .menu-item.danger:hover { background: rgba(229, 109, 117, .12); }
    .menu-sep {
      height: 1px;
      background: var(--line);
      margin: 5px 8px;
    }

    /* ===== 小屏适配 ===== */
    @media (max-width: 860px) {
      body { overflow: hidden; }
      .shell {
        grid-template-columns: 1fr;
        height: 100vh;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .now {
        height: auto;
        min-height: 120px;
        padding: 20px 18px 10px;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 14px;
        align-items: end;
      }
      .cover-wrap { width: 88px; }
      .track-meta { margin: 0; }
      h1 { font-size: 24px; }
      .artist { font-size: 13px; }
      .workspace {
        height: auto;
        min-height: 0;
        padding: 12px 12px 18px;
        grid-template-rows: auto auto minmax(0, 1fr) minmax(180px, auto);
      }
      .topbar { flex-wrap: wrap; }
      .coverbar { align-items: stretch; }
      .button { flex: 1; justify-content: center; }
      .segmented { width: 100%; }
      .segment { flex: 1; }
      .api-input { min-width: 100%; }
      .library { min-height: 0; max-height: 100%; }
      .library-head, .row {
        grid-template-columns: 34px minmax(0, 1fr) 62px 28px;
        padding-inline: 12px;
      }
      .controls { grid-template-columns: 1fr; }
      .main-controls, .right-controls { justify-self: center; }
      .right-controls { width: 100%; min-width: 0; justify-content: center; }
      .player { min-height: 180px; }
    }
  </style>
</head>
<body>
  <!-- 自定义标题栏：全透明悬浮，无边框无文字，仅窗口控制按钮 -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-title" data-tauri-drag-region>
      <span>🌸</span>
      <span>Hararu 樱花音乐盒</span>
    </div>
    <div class="titlebar-controls">
      <button id="tbMini" type="button" title="小窗播放" aria-label="小窗播放">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><rect x="10" y="11" width="6" height="4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="tbFocus" type="button" title="专注模式" aria-label="专注模式">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21M6 6l2.2 2.2M15.8 15.8 18 18M18 6l-2.2 2.2M8.2 15.8 6 18"/></svg>
      </button>
      <button id="tbPin" type="button" title="置顶窗口" aria-label="置顶窗口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 5 3 4H6l3-4z"/><path d="M12 12v7"/></svg>
      </button>
      <button id="tbMin" type="button" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="tbMax" type="button" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1"/></svg>
      </button>
      <button id="tbClose" class="tb-close" type="button" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- 服务状态提示 -->
  <div class="service-banner" id="serviceBanner">
    <span>本地服务未启动，保存功能不可用</span>
    <button id="serviceRetry" type="button">重试</button>
  </div>

  <!-- 飘落花瓣装饰 -->
  <div class="petal" style="left:8%;animation-duration:14s;animation-delay:0s;"></div>
  <div class="petal" style="left:24%;animation-duration:19s;animation-delay:3s;width:10px;height:10px;"></div>
  <div class="petal" style="left:41%;animation-duration:16s;animation-delay:6s;"></div>
  <div class="petal" style="left:63%;animation-duration:22s;animation-delay:1.5s;width:9px;height:9px;"></div>
  <div class="petal" style="left:82%;animation-duration:17s;animation-delay:4.5s;"></div>
  <div class="petal" style="left:92%;animation-duration:20s;animation-delay:8s;width:11px;height:11px;"></div>

  <div class="backdrop" id="backdrop"></div>
  <main class="shell" id="app">
    <section class="now">
      <div class="cover-wrap" id="coverWrap">
        <img class="cover" id="cover" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffe3ef'/%3E%3Cstop offset='1' stop-color='%23f8c9dd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='400' fill='url(%23g)'/%3E%3Ctext x='200' y='224' font-size='120' text-anchor='middle' fill='%23e79bbd' opacity='0.75'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
      </div>
      <div class="track-meta">
        <p class="eyebrow" id="status"><span class="dot"></span>本地音乐</p>
        <h1 id="title">选择音乐文件夹</h1>
        <p class="artist" id="artist">支持 MP3、FLAC、WAV、OGG、M4A、AAC</p>
      </div>
    </section>

    <section class="workspace">
      <div class="topbar">
        <div class="search">
          <span>⌕</span>
          <input id="search" type="search" placeholder="搜索歌曲 (Ctrl+F)">
        </div>
        <button class="button primary" id="pickFolder" type="button">＋ 导入文件夹</button>
        <button class="button" id="pickFiles" type="button">＋ 导入歌曲</button>
        <input id="folderInput" type="file" webkitdirectory directory multiple>
        <input id="fileInput" type="file" accept="audio/*,.flac,.ogg" multiple hidden>
        <input id="coverFilesInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" multiple>
        <input id="coverFolderInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" webkitdirectory directory multiple>
        <span class="path-chip">
          <input id="pathInput" type="text" placeholder="音乐文件夹路径 (设一次永久记住)">
          <button class="button small" id="savePathBtn" type="button">记住</button>
          <span class="path-status" id="pathStatus"></span>
        </span>
      </div>

      <div class="coverbar">
        <span class="coverbar-label">封面来源</span>
        <div class="segmented" role="group" aria-label="封面来源">
          <button class="segment" id="coverApiMode" type="button">API 图片</button>
          <button class="segment" id="coverLocalMode" type="button">本地图片</button>
        </div>
        <input class="api-input" id="coverApiInput" type="url" spellcheck="false" aria-label="API 地址">
        <input class="api-input" id="coverRefererInput" type="url" spellcheck="false" placeholder="Referer (可选,如 https://weibo.com/)" style="width:150px;" aria-label="Referer">
        <button class="button small" id="applyCoverApi" type="button">应用 API</button>
        <button class="button small" id="pickCoverFiles" type="button">＋ 选择图片</button>
        <button class="button small" id="pickCoverFolder" type="button">＋ 图片文件夹</button>
        <span class="path-chip">
          <input id="coverPathInput" type="text" placeholder="封面图片文件夹路径">
          <button class="button small" id="saveCoverPathBtn" type="button">记住</button>
          <span class="path-status" id="coverPathStatus"></span>
        </span>
        <span class="cover-count" id="coverCount">本地代理 API</span>
      </div>

      <div class="library">
        <div class="library-head">
          <span>#</span>
          <span>歌曲</span>
          <span>时长</span>
          <span title="移除">✕</span>
        </div>
        <div class="list" id="list">
          <div class="empty"><div class="big">🌸</div>拖入歌曲，或导入音乐文件夹</div>
        </div>
      </div>

      <div class="player">
        <div class="timeline">
          <span id="currentTime">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0">
          <span id="totalTime">0:00</span>
        </div>
        <div class="controls">
          <div></div>
          <div class="main-controls">
            <button class="icon-button" id="prev" type="button" title="上一首">⏮</button>
            <button class="icon-button play" id="play" type="button" title="播放">▶</button>
            <button class="icon-button" id="next" type="button" title="下一首">⏭</button>
          </div>
          <div class="right-controls">
            <button class="icon-button mode" id="mode" type="button" title="顺序播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
            <span title="音量"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.82">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 专注模式遮罩：唱片 + 时钟 + 精简播放栏 -->
  <div class="focus-overlay" id="focusOverlay">
    <div class="focus-clock" id="focusClock">00:00</div>
    <div class="focus-date" id="focusDate"></div>
    <div class="focus-record" id="focusFilm">
      <div class="focus-record-label">
        <img id="focusFilmImg" alt="">
      </div>
    </div>
    <div class="focus-player">
      <div class="focus-track" id="focusTrackTitle">未在播放</div>
      <div class="focus-timeline">
        <span id="focusCur">0:00</span>
        <input id="focusSeek" type="range" min="0" max="1000" value="0" aria-label="进度">
        <span id="focusTotal">0:00</span>
      </div>
      <div class="focus-controls">
        <button id="focusPrev" type="button" title="上一首">⏮</button>
        <button id="focusPlay" class="focus-play" type="button" title="播放">▶</button>
        <button id="focusNext" type="button" title="下一首">⏭</button>
      </div>
      <div class="focus-volume">
        <span title="音量">🔊</span>
        <input id="focusVolume" type="range" min="0" max="1" step="0.01" value="0.82" aria-label="音量">
      </div>
    </div>
  </div>

  <!-- 小窗播放模式：左侧图片 + 右侧播放栏 -->
  <div class="mini-overlay" id="miniOverlay">
    <button class="mini-exit" id="miniExit" type="button" title="退出小窗" aria-label="退出小窗">✕</button>
    <div class="mini-panel">
      <div class="mini-art">
        <img id="miniArtImg" alt="">
      </div>
      <div class="mini-body">
        <div class="mini-track"><span id="miniTrackTitle">未在播放</span></div>
        <div class="mini-timeline">
          <span id="miniCur">0:00</span>
          <input id="miniSeek" type="range" min="0" max="1000" value="0" aria-label="进度">
          <span id="miniTotal">0:00</span>
        </div>
        <div class="mini-controls">
          <button id="miniPrev" type="button" title="上一首">⏮</button>
          <button id="miniPlay" class="mini-play" type="button" title="播放">▶</button>
          <button id="miniNext" type="button" title="下一首">⏭</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

  <div class="context-menu" id="contextMenu" style="display:none;"></div>

  <script>
    // ============================================================
    // Hararu · 樱花音乐盒 —— 前端
    // 后端：本地 node server.js（127.0.0.1:8787）
    // ============================================================
    const audio = document.getElementById("audio");
    const folderInput = document.getElementById("folderInput");
    const fileInput = document.getElementById("fileInput");
    const listEl = document.getElementById("list");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const statusEl = document.getElementById("status");
    const currentTimeEl = document.getElementById("currentTime");
    const totalTimeEl = document.getElementById("totalTime");
    const seekEl = document.getElementById("seek");
    const volumeEl = document.getElementById("volume");
    const playBtn = document.getElementById("play");
    const modeBtn = document.getElementById("mode");
    const coverEl = document.getElementById("cover");
    const coverWrapEl = document.getElementById("coverWrap");
    const backdropEl = document.getElementById("backdrop");
    const searchEl = document.getElementById("search");
    const appEl = document.getElementById("app");
    const coverFilesInput = document.getElementById("coverFilesInput");
    const coverFolderInput = document.getElementById("coverFolderInput");
    const coverApiModeBtn = document.getElementById("coverApiMode");
    const coverLocalModeBtn = document.getElementById("coverLocalMode");
    const coverCountEl = document.getElementById("coverCount");
    const coverApiInput = document.getElementById("coverApiInput");
    const applyCoverApiBtn = document.getElementById("applyCoverApi");
    const contextMenuEl = document.getElementById("contextMenu");

    // ============================================================
    // 窗口控制：无边框窗口拖动 + 最小化/最大化/关闭
    // （壳版已开启 TauriApi，使用 window.__TAURI__；独立版自动降级）
    // ============================================================
    function getTauriWindow() {
      try {
        const w = window.__TAURI__?.window;
        if (w && typeof w.getCurrentWindow === "function") {
          return w.getCurrentWindow();
        }
      } catch (_) {}
      return null;
    }

    function setupWindowControls() {
      const tauriWin = getTauriWindow();
      const isTauriShell = !!tauriWin;
      // 仅在壳版环境启用标题栏布局（独立版/浏览器直接打开时保持原布局）
      if (isTauriShell) {
        document.body.classList.add("has-titlebar");
      } else {
        // 非壳版环境隐藏自定义标题栏，恢复系统窗口
        const tb = document.getElementById("titlebar");
        if (tb) tb.style.display = "none";
      }

      // 拖动窗口：WebView2 支持 -webkit-app-region: drag；Tauri 也支持 data-tauri-drag-region
      // （CSS 已设置，此处为兜底：监听标题栏 mousedown 触发 Tauri startDragging）
      const titlebarEl = document.getElementById("titlebar");
      if (titlebarEl && tauriWin && typeof tauriWin.startDragging === "function") {
        titlebarEl.addEventListener("mousedown", (e) => {
          // 只对非交互元素（标题区）触发拖动；按钮区域不触发
          if (e.target.closest("button")) return;
          if (e.button === 0) {
            try { tauriWin.startDragging(); } catch (_) {}
          }
        });
      }

      // 最小化
      document.getElementById("tbMin")?.addEventListener("click", () => {
        if (tauriWin && tauriWin.minimize) tauriWin.minimize();
      });
      // 最大化/还原
      document.getElementById("tbMax")?.addEventListener("click", async () => {
        if (!tauriWin) return;
        try {
          if (typeof tauriWin.toggleMaximize === "function") {
            await tauriWin.toggleMaximize();
          } else if (tauriWin.isMaximized) {
            const isMax = await tauriWin.isMaximized();
            if (isMax) await tauriWin.unmaximize();
            else await tauriWin.maximize();
          }
        } catch (_) {}
      });
      // 关闭
      document.getElementById("tbClose")?.addEventListener("click", () => {
        if (tauriWin && tauriWin.close) tauriWin.close();
        else window.close();
      });
    }

    // ============================================================
    // 服务健康检测：8787 本地 node 服务是否在线
    // ============================================================
    function checkService() {
      return fetch("http://127.0.0.1:8787/api/load-path", { cache: "no-store" })
        .then((r) => r.ok)
        .catch(() => false);
    }

    function showServiceBanner(show) {
      const banner = document.getElementById("serviceBanner");
      if (banner) banner.classList.toggle("visible", show);
    }

    document.getElementById("serviceRetry")?.addEventListener("click", async () => {
      const ok = await checkService();
      showServiceBanner(!ok);
      if (ok) {
        // 服务恢复后重新走恢复逻辑
        window.location.reload();
      }
    });

    // 启动时初始化窗口控制 + 服务检测
    // （脚本位于 body 末尾，DOM 已就绪，直接执行）
    setupWindowControls();
    // 主动聚焦页面，否则快捷键（如 Ctrl+空格）需先按 F12 才生效
    function forceFocus() {
      try { window.focus(); } catch (_) {}
      try {
        const w = getTauriWindow();
        if (w && typeof w.setFocus === "function") w.setFocus();
        if (w && typeof w.show === "function") w.show();
      } catch (_) {}
      try { document.body.tabIndex = -1; document.body.focus(); } catch (_) {}
    }
    setTimeout(forceFocus, 200);
    setTimeout(forceFocus, 800);
    setTimeout(forceFocus, 1600);
    setTimeout(forceFocus, 3000);
    // 额外尝试：短暂聚焦一个隐藏输入框，试图让 WebView2 获得"键盘焦点"，
    // 使 Ctrl+空格 等快捷键无需先手动点击输入框即可生效（不改变窗口尺寸）。
    function activateKeyboardFocus() {
      try {
        let dummy = document.createElement("input");
        dummy.type = "text";
        dummy.setAttribute("autocomplete", "off");
        dummy.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;";
        document.body.appendChild(dummy);
        dummy.focus();
        setTimeout(function () {
          try { dummy.remove(); } catch (_) {}
          try { document.body.focus(); } catch (_) {}
        }, 600);
      } catch (_) {}
    }
    setTimeout(activateKeyboardFocus, 400);
    setTimeout(activateKeyboardFocus, 1200);
    setTimeout(activateKeyboardFocus, 2600);
    // 页面获得焦点或用户点击时，也保持焦点（防止焦点被夺走导致快捷键失效）
    window.addEventListener("focus", forceFocus);
    window.addEventListener("mousedown", forceFocus);
    document.addEventListener("visibilitychange", forceFocus);

    // （已移除启动时 setSize 微调：壳会对每次 setSize 再加约 20px，
    //  反复 setSize 会导致窗口每次启动变长。窗口尺寸完全交给壳配置决定。）
    setTimeout(async () => {
      const ok = await checkService();
      showServiceBanner(!ok);
    }, 1200);

    const audioTypes = new Set(["mp3", "flac", "wav", "ogg", "m4a", "aac"]);
    const imageTypes = new Set(["jpg", "jpeg", "png", "webp", "gif"]);
    const defaultCoverApiUrl = "https://api.cnmiw.com/api.php?sort=CDNrandom&type=json&num=5";
    // 单次抓取的图片数量上限：把 API 的 num 提到这个值，避免"永远只循环固定几张封面"
    const DEFAULT_COVER_COUNT = 30;

    // 内置樱花渐变占位封面（SVG data URI，永不裂图）
    const FALLBACK_COVER = coverEl.src;

    let tracks = [];
    let filtered = [];
    let current = -1;
    let shuffle = false;
    let repeatMode = 0;            // 0=顺序 1=单曲 2=全部循环
    let playHistory = [];          // 随机播放的"听歌历史"栈（存曲目引用），供"上一首"回退到真正听过的歌
    let userSeeking = false;
    let apiCovers = [];
    let coverRequest = null;
    let localCovers = [];
    let pathCoverLoaded = false;
    let lastCoverSrc = "";        // 上一次显示的封面源地址（去时间戳），用于保证下次切歌不是同一张
    let searchQuery = "";
    let coverMode = localStorage.getItem("hararuCoverMode") || "api";
    coverApiInput.value = localStorage.getItem("hararuCoverApiUrl") || defaultCoverApiUrl;
    let coverReferer = localStorage.getItem("hararuCoverReferer") || "";
    document.getElementById("coverRefererInput").value = coverReferer;

    // 单一模式按钮：0=随机 1=顺序 2=单曲 3=全部
    const MODE_ICONS = [
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">1</text></svg>',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'
    ];
    const MODE_TITLES = ["随机播放", "顺序播放", "单曲循环", "全部循环"];

    // ---------- 工具函数 ----------
    function toProxiedCoverUrl(url) {
      if (!coverReferer) return url;
      if (!/^https?:\/\//i.test(url)) return url;
      // 本地 node 服务 (127.0.0.1:8787) 的图片直接加载，不走代理
      if (/^https?:\/\/(127\.0\.0\.1|localhost):8787\//i.test(url)) return url;
      return `http://127.0.0.1:8787/api/proxy?url=${encodeURIComponent(url)}&referer=${encodeURIComponent(coverReferer)}`;
    }

    audio.volume = Number(localStorage.getItem("hararuVolume") || volumeEl.value);

    function formatTime(value) {
      if (!Number.isFinite(value)) return "0:00";
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function cleanName(name) {
      return name.replace(/\.[^.]+$/, "").replace(/_/g, " ").trim();
    }

    function splitArtist(name) {
      const clean = cleanName(name);
      const parts = clean.split(/\s+-\s+/);
      if (parts.length > 1) {
        return { artist: parts[0], title: parts.slice(1).join(" - ") };
      }
      return { artist: "本地文件", title: clean };
    }

    function getFolderName(file) {
      const path = file.webkitRelativePath || file.name;
      const pieces = path.split("/");
      return pieces.length > 1 ? pieces.slice(0, -1).join(" / ") : "手动导入";
    }

    function makeTrack(file, index) {
      const info = splitArtist(file.name);
      return {
        id: `${file.name}-${file.size}-${file.lastModified}-${index}`,
        file,
        url: URL.createObjectURL(file),
        title: info.title,
        artist: info.artist,
        folder: getFolderName(file),
        duration: NaN
      };
    }

    // ---------- 导入 ----------
    function addFiles(files) {
      const valid = Array.from(files).filter((file) => {
        const ext = file.name.split(".").pop().toLowerCase();
        return file.type.startsWith("audio/") || audioTypes.has(ext);
      });
      if (!valid.length) return;
      tracks.forEach((track) => URL.revokeObjectURL(track.url));
      tracks = valid
        .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, "zh-Hans-CN"))
        .map(makeTrack);
      current = tracks.length ? 0 : -1;
      playHistory = [];   // 新列表，清空听歌历史
      applySearch();
      if (tracks.length) { loadTrack(0, false); probeDurations(); }
    }

    function readDirectoryEntry(entry) {
      const reader = entry.createReader();
      const entries = [];
      return new Promise((resolve, reject) => {
        const readBatch = () => {
          reader.readEntries((batch) => {
            if (!batch.length) { resolve(entries); return; }
            entries.push(...batch);
            readBatch();
          }, reject);
        };
        readBatch();
      });
    }

    function fileFromEntry(entry) {
      return new Promise((resolve, reject) => entry.file(resolve, reject));
    }

    async function collectFilesFromEntry(entry) {
      if (!entry) return [];
      if (entry.isFile) return [await fileFromEntry(entry)];
      if (!entry.isDirectory) return [];
      const children = await readDirectoryEntry(entry);
      const nested = await Promise.all(children.map(collectFilesFromEntry));
      return nested.flat();
    }

    async function collectDroppedFiles(dataTransfer) {
      const items = Array.from(dataTransfer.items || []);
      const entries = items
        .map((item) => typeof item.webkitGetAsEntry === "function" ? item.webkitGetAsEntry() : null)
        .filter(Boolean);
      if (entries.length) {
        const nested = await Promise.all(entries.map(collectFilesFromEntry));
        return nested.flat();
      }
      return Array.from(dataTransfer.files || []);
    }

    function isImageFile(file) {
      const ext = file.name.split(".").pop().toLowerCase();
      return file.type.startsWith("image/") || imageTypes.has(ext);
    }

    // ---------- 本地封面 (IndexedDB，兜底) ----------
    function openCoverDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error("IndexedDB unavailable")); return; }
        const request = indexedDB.open("hararu-cover-db", 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("covers")) {
            db.createObjectStore("covers", { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function loadLocalCovers() {
      // 如果已经从文件夹路径加载过封面，则跳过 IndexedDB，避免覆盖
      if (pathCoverLoaded) { updateCoverControls(); return; }
      try {
        const db = await openCoverDb();
        const coversFromDb = await new Promise((resolve, reject) => {
          const tx = db.transaction("covers", "readonly");
          const request = tx.objectStore("covers").getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        localCovers.forEach((cover) => URL.revokeObjectURL(cover.url));
        localCovers = coversFromDb
          .sort((a, b) => a.id - b.id)
          .map((item) => ({ name: item.name, url: URL.createObjectURL(item.blob) }));
      } catch (error) {
        console.warn("Local covers unavailable:", error);
        localCovers = [];
      }
      updateCoverControls();
    }

    async function saveLocalCoverFiles(files) {
      const valid = Array.from(files).filter(isImageFile);
      if (!valid.length) return;
      try {
        const db = await openCoverDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction("covers", "readwrite");
          const store = tx.objectStore("covers");
          store.clear();
          valid.forEach((file, index) => {
            store.put({ id: index, name: file.name, blob: file, lastModified: file.lastModified });
          });
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        await loadLocalCovers();
        setCoverMode("local");
      } catch (error) {
        console.warn("Unable to save local covers:", error);
      }
    }

    function updateCoverControls() {
      coverApiModeBtn.classList.toggle("active", coverMode === "api");
      coverLocalModeBtn.classList.toggle("active", coverMode === "local");
      coverCountEl.textContent = coverMode === "api"
        ? "本地代理 API"
        : (localCovers.length ? `${localCovers.length} 张本地图片` : "未选择图片");
      coverApiInput.disabled = coverMode !== "api";
      applyCoverApiBtn.disabled = coverMode !== "api";
    }

    function setCoverMode(mode) {
      coverMode = mode;
      localStorage.setItem("hararuCoverMode", coverMode);
      updateCoverControls();
      if (tracks[current]) {
        setCoverForTrack(tracks[current]);
      } else {
        setStartupCover();
      }
    }

    function getCoverApiUrl() {
      const raw = (coverApiInput.value || "").trim() || defaultCoverApiUrl;
      // 自动把 num 提到 DEFAULT_COVER_COUNT：即使之前保存的是 num=5，
      // 也让 API 模式每次抓更多张，避免封面永远固定那几张。
      const re = /\bnum=(\d+)/i;
      if (re.test(raw)) return raw.replace(re, "num=" + DEFAULT_COVER_COUNT);
      return raw + (raw.includes("?") ? "&" : "?") + "num=" + DEFAULT_COVER_COUNT;
    }

    function applyCoverApiUrl() {
      const nextUrl = getCoverApiUrl();
      coverApiInput.value = nextUrl;
      localStorage.setItem("hararuCoverApiUrl", nextUrl);
      coverReferer = document.getElementById("coverRefererInput").value.trim();
      localStorage.setItem("hararuCoverReferer", coverReferer);
      apiCovers = [];
      coverRequest = null;
      setCoverMode("api");
      saveAllConfig();
    }

    // ---------- 列表渲染 ----------
    function applySearch() {
      searchQuery = searchEl.value.trim().toLowerCase();
      filtered = tracks.filter((track) => {
        const haystack = `${track.title} ${track.artist} ${track.folder}`.toLowerCase();
        return haystack.includes(searchQuery);
      });
      renderList();
      statusEl.textContent = tracks.length ? `${tracks.length} 首歌曲` : "本地音乐";
    }

    function highlight(text) {
      if (!searchQuery) return escapeHtml(text);
      const lower = text.toLowerCase();
      let idx = lower.indexOf(searchQuery);
      if (idx < 0) return escapeHtml(text);
      const before = escapeHtml(text.slice(0, idx));
      const match = escapeHtml(text.slice(idx, idx + searchQuery.length));
      const after = highlight(text.slice(idx + searchQuery.length));
      return `${before}<mark>${match}</mark>${after}`;
    }

    function renderList() {
      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty"><div class="big">🌸</div>${tracks.length ? "没有匹配的歌曲～" : "拖入歌曲，或导入音乐文件夹"}</div>`;
        return;
      }
      const rows = filtered.map((track, i) => {
        const trackIndex = tracks.indexOf(track);
        const active = trackIndex === current ? " active" : "";
        return `
          <div class="row${active}" data-index="${trackIndex}">
            <div class="index">${String(i + 1).padStart(2, "0")}</div>
            <div>
              <div class="song-title">${highlight(track.title)}</div>
              <div class="song-path">${escapeHtml(track.artist)} · ${escapeHtml(track.folder)}</div>
            </div>
            <div class="duration">${formatTime(track.duration)}</div>
            <div class="row-actions" data-remove="${trackIndex}" title="从列表移除">✕</div>
          </div>
        `;
      }).join("");
      listEl.innerHTML = rows;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    // ---------- 封面 ----------
    function fallbackCoverFor(track) {
      if (coverMode === "local" && localCovers.length) {
        return localCovers[Math.abs(hashCode(track.title + track.artist)) % localCovers.length].url;
      }
      return FALLBACK_COVER;
    }

    function applyCover(url, fallback) {
      url = toProxiedCoverUrl(url);
      coverEl.style.opacity = "0";
      const swap = () => {
        coverEl.onerror = () => {
          coverEl.onerror = null;
          coverEl.src = fallback || FALLBACK_COVER;
          backdropEl.style.setProperty("--cover", "none");
          coverEl.style.opacity = "1";
        };
        coverEl.referrerPolicy = "no-referrer";
        coverEl.src = url;
        backdropEl.style.setProperty("--cover", `url("${url.replace(/"/g, '\\"')}")`);
        coverEl.style.opacity = "1";
      };
      setTimeout(swap, 60);
    }

    function applyCoverSequence(urls, fallback) {
      const queue = urls.filter(Boolean).map(toProxiedCoverUrl);
      const tryNext = () => {
        const url = queue.shift();
        if (!url) {
          coverEl.onerror = null;
          coverEl.src = fallback || FALLBACK_COVER;
          backdropEl.style.setProperty("--cover", "none");
          return;
        }
        coverEl.onerror = tryNext;
        coverEl.referrerPolicy = "no-referrer";
        coverEl.src = url;
        backdropEl.style.setProperty("--cover", `url("${url.replace(/"/g, '\\"')}")`);
      };
      tryNext();
    }

    function cacheBust(url) {
      const joiner = url.includes("?") ? "&" : "?";
      return `${url}${joiner}_=${Date.now()}`;
    }

    // 去掉我们加的"_"时间戳后缀，得到"源图地址"，用于判断是否与当前封面相同
    function stripCacheBust(u) {
      return String(u).replace(/[?&]_=\d+$/, "");
    }

    // 从池子里挑一张"不同于当前封面"的图，尽量保证每次切歌封面真的会变
    function pickFreshCover(pool) {
      if (!pool || !pool.length) return "";
      if (pool.length === 1) return pool[0];
      const cur = lastCoverSrc;
      let idx = Math.floor(Math.random() * pool.length);
      for (let t = 0; t < pool.length * 3 && stripCacheBust(pool[idx]) === cur; t++) {
        idx = Math.floor(Math.random() * pool.length);
      }
      return pool[idx];
    }

    function extractImageUrls(payload) {
      if (!payload) return [];
      if (typeof payload === "string") {
        if (/^https?:\/\//i.test(payload)) return [payload];
        return [];
      }
      if (Array.isArray(payload)) return payload.flatMap(extractImageUrls);
      if (typeof payload !== "object") return [];
      var commonKeys = ["url", "img", "image", "pic", "data", "cover", "src",
        "cover_url", "pic_url", "img_url", "image_url", "list", "result",
        "urls", "imgs", "pics", "images", "thumbnail", "thumb", "coverUrl",
        "coverImg", "background", "bg", "avatar", "banner", "poster"];
      var direct = [];
      commonKeys.forEach(function (k) {
        if (k in payload) direct = direct.concat(extractImageUrls(payload[k]));
      });
      if (direct.length) return direct.filter(function (u, i, a) { return a.indexOf(u) === i; });
      var results = [];
      Object.keys(payload).forEach(function (k) {
        var val = payload[k];
        if (val && (typeof val === "object" || Array.isArray(val))) {
          results = results.concat(extractImageUrls(val));
        }
      });
      return results.filter(function (u, i, a) { return a.indexOf(u) === i; });
    }

    async function fetchApiCovers() {
      if (coverRequest) return coverRequest;
      coverRequest = (async () => {
        const endpoint = getCoverApiUrl();
        let remote = [];
        try {
          // 给请求附加时间戳：让上游 CDN 每次返回新图，避免命中缓存导致封面"固定不变"
          const bustEndpoint = endpoint + (endpoint.includes("?") ? "&" : "?") + "_=" + Date.now();
          const proxyUrl = `http://127.0.0.1:8787/api/proxy?url=${encodeURIComponent(bustEndpoint)}`;
          const response = await fetch(proxyUrl, { cache: "no-store" });
          const type = response.headers.get("content-type") || "";
          if (!response.ok) throw new Error(`Proxy HTTP ${response.status}`);
          if (type.startsWith("image/")) {
            const blob = await response.blob();
            remote = [URL.createObjectURL(blob)];
          } else {
            const payload = await response.json();
            remote = extractImageUrls(payload);
          }
        } catch (error) {
          console.warn("Cover API unavailable:", endpoint, error);
        }
        // 本地随机图片兜底：远程 API 失效/无结果时仍能显示随机图
        const localRandom = "http://127.0.0.1:8787/api/random-image";
        // 去重；若远端口径返回的图太少，补齐本地随机图，尽量让封面不会永远固定几张
        const merged = remote.filter(Boolean).filter((u, i, a) => a.indexOf(u) === i);
        if (merged.length < 4) merged.push(localRandom);
        if (!merged.length) merged.push(localRandom);
        return merged;
      })();
      try {
        apiCovers = await coverRequest;
        return apiCovers;
      } finally {
        coverRequest = null;
      }
    }

    async function setStartupCover() {
      const fallback = FALLBACK_COVER;
      if (coverMode === "local") {
        const localCover = localCovers[0]?.url || fallback;
        lastCoverSrc = stripCacheBust(localCover);
        applyCover(localCover, fallback);
        return;
      }
      applyCover(fallback, fallback);
      const pool = await fetchApiCovers();
      if (!pool.length || tracks.length) return;
      const apiCover = pool[Math.floor(Math.random() * pool.length)];
      lastCoverSrc = stripCacheBust(apiCover);
      applyCover(/^https?:/i.test(apiCover) ? cacheBust(apiCover) : apiCover, fallback);
    }

    async function setCoverForTrack(track) {
      const fallback = fallbackCoverFor(track);
      if (coverMode === "local") {
        // 本地模式：每次切歌也从本地图里挑一张不同的，保证封面真的会换
        const localCover = pickFreshCover(localCovers.map((c) => c.url));
        const localUrl = localCover && /^https?:/i.test(localCover) ? cacheBust(localCover) : (localCover || fallback);
        lastCoverSrc = stripCacheBust(localCover || fallback);
        applyCover(localUrl, FALLBACK_COVER);
        return;
      }
      applyCover(fallback, fallback);
      coverRequest = null;
      const pool = await fetchApiCovers();
      if (!pool.length || track !== tracks[current]) return;
      const apiCover = pickFreshCover(pool);
      lastCoverSrc = stripCacheBust(apiCover);
      // 给 URL 加时间戳：本地随机图 / 远端图不会命中缓存，每次切歌都尽力换新
      applyCover(/^https?:/i.test(apiCover) ? cacheBust(apiCover) : apiCover, fallback);
    }

    function hashCode(value) {
      let hash = 0;
      for (let i = 0; i < value.length; i += 1) {
        hash = ((hash << 5) - hash) + value.charCodeAt(i);
        hash |= 0;
      }
      return hash;
    }

    // ---------- 播放控制 ----------
    function pushHistory(track) {
      if (!track) return;
      if (playHistory[playHistory.length - 1] !== track) playHistory.push(track);
      if (playHistory.length > 500) playHistory.shift();
    }

    function loadTrack(index, shouldPlay = true, recordHistory = true) {
      if (!tracks[index]) return;
      const prevTrackRef = tracks[current] || null;
      current = index;
      const track = tracks[current];
      // 随机播放下把"离开的那首"记入历史，供"上一首"回退到真正听过的歌
      if (recordHistory && shuffle && prevTrackRef && prevTrackRef !== track) {
        pushHistory(prevTrackRef);
      }
      audio.src = track.url;
      titleEl.textContent = track.title;
      artistEl.textContent = track.artist;
      setCoverForTrack(track);
      renderList();
      scrollCurrentIntoView();
      if (shouldPlay) {
        audio.play().catch(() => {});
      }
    }

    function scrollCurrentIntoView() {
      const row = listEl.querySelector(".row.active");
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    // 打开时预读每首歌的时长：用隐藏的 <audio> 逐个读取元数据，
    // 无需等用户点播即可在列表里正确显示时长（浏览器能解码即可读到）。
    let durationProbeAudio = null;
    let durationProbing = false;
    function probeDurations() {
      if (durationProbing) return;
      const pending = tracks.filter(function (t) { return !Number.isFinite(t.duration); });
      if (!pending.length) return;
      durationProbing = true;
      if (!durationProbeAudio) {
        durationProbeAudio = new Audio();
        durationProbeAudio.preload = "metadata";
      }
      let idx = 0;
      function next() {
        if (idx >= pending.length) { durationProbing = false; return; }
        const t = pending[idx++];
        let timer = null;
        const cleanup = function () {
          clearTimeout(timer);
          durationProbeAudio.removeEventListener("loadedmetadata", onMeta);
          durationProbeAudio.removeEventListener("error", onErr);
        };
        const onMeta = function () {
          cleanup();
          if (Number.isFinite(durationProbeAudio.duration)) t.duration = durationProbeAudio.duration;
          renderList();
          setTimeout(next, 0);
        };
        const onErr = function () {
          cleanup();
          setTimeout(next, 0);
        };
        durationProbeAudio.addEventListener("loadedmetadata", onMeta);
        durationProbeAudio.addEventListener("error", onErr);
        durationProbeAudio.src = t.url;
        durationProbeAudio.load();
        timer = setTimeout(onErr, 4000); // 单项 4 秒拿不到就跳过，避免卡住
      }
      next();
    }

    function togglePlay() {
      if (!tracks.length) { folderInput.click(); return; }
      if (current < 0) loadTrack(0, false);
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function nextTrack() {
      if (!tracks.length) return;
      if (shuffle) {
        const next = tracks.length === 1 ? 0 : Math.floor(Math.random() * tracks.length);
        loadTrack(next === current ? (next + 1) % tracks.length : next);
        return;
      }
      loadTrack((current + 1) % tracks.length);
    }

    function prevTrack() {
      if (!tracks.length) return;
      // 随机模式：优先回退到"上一首实际听过的歌"（播放历史栈）
      if (shuffle) {
        const last = playHistory.pop();
        if (last) {
          const idx = tracks.indexOf(last);
          if (idx >= 0) { loadTrack(idx, true, false); return; }
        }
        // 无历史（随机刚开始/历史曲目已被移除）时按列表顺序回退，且不再记入历史避免来回弹
        loadTrack((current - 1 + tracks.length) % tracks.length, true, false);
        return;
      }
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      loadTrack((current - 1 + tracks.length) % tracks.length);
    }

    function removeTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      const wasCurrent = index === current;
      const wasPlaying = !audio.paused;
      const removed = tracks[index];
      if (removed.url && removed.url.startsWith("blob:")) URL.revokeObjectURL(removed.url);
      tracks.splice(index, 1);
      if (tracks.length === 0) {
        current = -1;
        audio.pause();
        audio.removeAttribute("src");
        titleEl.textContent = "选择音乐文件夹";
        artistEl.textContent = "支持 MP3、FLAC、WAV、OGG、M4A、AAC";
        statusEl.textContent = "本地音乐";
      } else if (wasCurrent) {
        current = Math.min(index, tracks.length - 1);
        loadTrack(current, wasPlaying);
      } else if (index < current) {
        current -= 1;
      }
      applySearch();
    }

    function clearTracks() {
      tracks.forEach((track) => { if (track.url && track.url.startsWith("blob:")) URL.revokeObjectURL(track.url); });
      tracks = [];
      current = -1;
      playHistory = [];
      audio.pause();
      audio.removeAttribute("src");
      titleEl.textContent = "选择音乐文件夹";
      artistEl.textContent = "支持 MP3、FLAC、WAV、OGG、M4A、AAC";
      statusEl.textContent = "本地音乐";
      applySearch();
    }

    let combinedMode = 1;   // 0=随机 1=顺序 2=单曲 3=全部

    // 单一模式按钮：点一下在 随机→顺序→单曲→全部 之间循环
    function applyCombinedMode(mode) {
      combinedMode = ((mode % 4) + 4) % 4;
      playHistory = [];   // 切换播放模式时清空听歌历史，重新开始记录
      if (combinedMode === 0) { shuffle = true; repeatMode = 0; }
      else { shuffle = false; repeatMode = combinedMode - 1; }
      if (modeBtn) {

        modeBtn.classList.toggle("on", combinedMode !== 1); // 顺序为默认态不点亮
      }
      localStorage.setItem("hararuShuffle", shuffle ? "1" : "0");
      localStorage.setItem("hararuRepeatMode", String(repeatMode));

    // 把当前封面图片保存到本地（优先弹"另存为"对话框，失败则走下载）
    async function saveCoverImage() {
      const el = document.getElementById("cover");
      const url = el && el.src ? el.src : null;
      if (!url) return;
      const name = "hararu-cover_" + Date.now() + ".jpg";
      // 1) 用 File System Access API 弹"另存为"窗口（需在用户手势内同步调用）
      if (typeof window.showSaveFilePicker === "function") {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: name,
            types: [{ description: "图片", accept: { "image/*": [".jpg", ".jpeg", ".png", ".webp", ".gif", ".svg"] } }]
          });
          const blob = await fetch(url).then(function (r) { return r.blob(); });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return; // 用户取消
          // 其它错误回退到下载
        }
      }
      // 2) 兜底：a.download 触发浏览器下载
      try {
        const blob = await fetch(url).then(function (r) { return r.blob(); });
        const sub = (blob.type || "image/jpeg").split("/")[1] || "jpg";
        const ext = sub === "jpeg" ? "jpg" : sub;
        const obj = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = obj;
        a.download = "hararu-cover_" + Date.now() + "." + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(obj); }, 3000);
      } catch (e) {
        console.warn("[保存封面失败]", e);
      }
    }

      if (event.target.matches("input") && event.target.type !== "range") return;
      if (event.code === "Space" && !event.ctrlKey && !event.metaKey) { event.preventDefault(); togglePlay(); }
      if (event.code === "ArrowRight") audio.currentTime = Math.min((audio.currentTime || 0) + 5, audio.duration || 0);
      if (event.code === "ArrowLeft") audio.currentTime = Math.max((audio.currentTime || 0) - 5, 0);
      if (event.code === "ArrowUp") { event.preventDefault(); audio.volume = Math.min(1, (audio.volume || 0) + 0.05); syncVolumeDisplays(); }
      if (event.code === "ArrowDown") { event.preventDefault(); audio.volume = Math.max(0, (audio.volume || 0) - 0.05); syncVolumeDisplays(); }
      if (event.key === "r" || event.key === "R" || event.key === "s" || event.key === "S") cycleRepeat();
      if (event.key === "Delete") { if (current >= 0) removeTrack(current); }

    function openSessionDb() {
      return new Promise(function (resolve, reject) {
        if (!window.indexedDB) { reject(new Error("IndexedDB 不可用")); return; }
        var req = indexedDB.open("hararu-session-db", 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains("handles")) {
            db.createObjectStore("handles");
          }
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    }

    function isAudioFile(file) {
      var ext = file.name.split(".").pop().toLowerCase();
      return file.type.startsWith("audio/") || audioTypes.has(ext);
    }
    function isImageFileSimple(file) {
      var ext = file.name.split(".").pop().toLowerCase();
      return file.type.startsWith("image/") || imageTypes.has(ext);
    }

    function walkDir(dirHandle, prefix, filterFn) {
      var results = [];
      var iterator = dirHandle.values();
      function readNext() {
        return iterator.next().then(function (entry) {
          if (entry.done) return results;
          var item = entry.value;
          if (item.kind === "file") {
            return item.getFile().then(function (file) {
              if (filterFn(file)) {
                var relPath = prefix ? prefix + "/" + item.name : item.name;
                try {
                  Object.defineProperty(file, "webkitRelativePath", { value: relPath, writable: false });
                } catch (_) {}
                results.push(file);
              }
              return readNext();
            });
          } else if (item.kind === "directory") {
            var subPrefix = prefix ? prefix + "/" + item.name : item.name;
            return walkDir(item, subPrefix, filterFn).then(function (sub) {
              results = results.concat(sub);
              return readNext();
            });
          }
          return readNext();
        });
      }
      return readNext();
    }

    function pickMusicFolderWithPicker() {
      if (!window.showDirectoryPicker) return Promise.resolve(false);

          if (!files.length) return false;
          addFiles(files);
          statusEl.textContent = files.length + " 首歌曲 · " + handle.name;
          return true;
        });
      }).catch(function (e) {
        if (e.name === "AbortError" || e.name === "SecurityError") return false;
        console.warn("showDirectoryPicker 失败:", e);
        return false;
      });
    }

        });
